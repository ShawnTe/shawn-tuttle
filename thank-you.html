<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Shawn Tuttle</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
:root {
  --cream:         #FBF4E8;
  --watermelon:    #D63F5A;
  --watermelon-dk: #B02E47;
  --amber:         #F5A520;
  --amber-warm:    #F7C94A;
  --ink:           #28100C;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Josefin Sans', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  color: var(--cream);
  background: linear-gradient(148deg, #C03050 0%, #9B1B30 55%, #7A1025 100%);
  min-height: 100svh;
  display: flex;
  align-items: center;
  position: relative;
  overflow-x: hidden;
}

/* same warm light bloom as the home page hero */
body::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 45% 60% at 10% 20%, rgba(245,165,32,0.16) 0%, transparent 65%);
  pointer-events: none;
}

.thanks {
  position: relative;
  max-width: 720px;
  margin: 0 auto;
  padding: 80px clamp(24px,6vw,48px);
  width: 100%;
}

.script {
  display: block;
  font-family: 'Dancing Script', cursive; font-weight: 700;
  font-size: clamp(1.7rem, 4.5vw, 2.6rem);
  color: var(--amber-warm);
  line-height: 1.15;
  margin-bottom: 16px;
}

h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: clamp(2.2rem, 5.5vw, 3.6rem);
  line-height: 1.05;
  color: #fff;
  margin-bottom: 28px;
}

p {
  max-width: 52ch;
  margin-bottom: 1em;
  color: rgba(251,244,232,0.80);
}

.sig {
  display: block;
  font-family: 'Dancing Script', cursive; font-weight: 700;
  font-size: 2rem;
  color: var(--amber-warm);
  margin: 28px 0 44px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 36px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: 4px;
  background: var(--cream);
  color: var(--ink);
  box-shadow: 4px 4px 0 rgba(251,244,232,0.25);
  transition: transform 0.2s ease, background 0.2s ease;
}
.btn:hover { transform: translateY(-2px); background: var(--amber-warm); }
.btn:focus-visible { outline: 2px dashed var(--amber-warm); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
  </style>
</head>
<body>

<main class="thanks">
  <span class="script">Got it.</span>
  <h1>Thank you for sharing where you are.</h1>
  <p>I&rsquo;ll read what you wrote and get back to you by email within a couple of days.</p>
  <p>In the meantime, there&rsquo;s nothing you need to have figured out. Noticing that something is shifting is already a first step.</p>
  <span class="sig">&mdash; Shawn</span>
  <a class="btn" href="index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back to the site
  </a>
</main>

</body>
</html>
